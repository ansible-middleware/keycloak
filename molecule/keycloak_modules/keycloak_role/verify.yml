---
# Ported from community.general tests/integration/targets/keycloak_role
# Tests full CRUD lifecycle for realm/client roles and composite role management.

- name: Load role test variables
  ansible.builtin.include_vars:
    file: vars.yml

# --- Realm role CRUD ---

- name: Create realm role
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    name: myrole-test
    description: "{{ description_1 }}"
    state: present
  register: result

- name: Assert realm role created
  ansible.builtin.assert:
    that:
      - result is changed
      - result.existing == {}
      - result.end_state.name == "myrole-test"
      - result.end_state.containerId == ephemeral_realm

- name: Create realm role again (idempotency)
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    name: myrole-test
    description: "{{ description_1 }}"
    state: present
  register: result

- name: Assert realm role unchanged
  ansible.builtin.assert:
    that:
      - result is not changed

- name: Update realm role description
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    name: myrole-test
    description: "{{ description_2 }}"
    state: present
  register: result

- name: Assert realm role updated
  ansible.builtin.assert:
    that:
      - result is changed
      - result.existing.description == description_1
      - result.end_state.description == description_2

- name: Delete realm role
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    name: myrole-test
    state: absent
  register: result

- name: Assert realm role deleted
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state == {}

- name: Delete absent realm role (idempotency)
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    name: myrole-test
    state: absent
  register: result

- name: Assert no change on absent realm role
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.end_state == {}

# --- Client role CRUD ---

- name: Create client for role tests
  middleware_automation.keycloak.keycloak_client:
    realm: "{{ ephemeral_realm }}"
    client_id: myclient
    state: present
  register: role_test_client

- name: Create client role
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    client_id: myclient
    name: client-role-test
    description: "{{ description_1 }}"
    state: present
  register: result

- name: Assert client role created
  ansible.builtin.assert:
    that:
      - result is changed
      - result.existing == {}
      - result.end_state.name == "client-role-test"
      - result.end_state.containerId == role_test_client.end_state.id

- name: Create client role again (idempotency)
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    client_id: myclient
    name: client-role-test
    description: "{{ description_1 }}"
    state: present
  register: result

- name: Assert client role unchanged
  ansible.builtin.assert:
    that:
      - result is not changed

- name: Update client role description
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    client_id: myclient
    name: client-role-test
    description: "{{ description_2 }}"
    state: present
  register: result

- name: Assert client role updated
  ansible.builtin.assert:
    that:
      - result is changed
      - result.existing.description == description_1
      - result.end_state.description == description_2

- name: Delete client role
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    client_id: myclient
    name: client-role-test
    state: absent
  register: result

- name: Assert client role deleted
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state == {}

- name: Delete absent client role (idempotency)
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    client_id: myclient
    name: client-role-test
    state: absent
  register: result

- name: Assert no change on absent client role
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.end_state == {}

# --- Composite realm roles ---

- name: Create realm role with composites
  middleware_automation.keycloak.keycloak_role:
    name: composite-role
    realm: "{{ ephemeral_realm }}"
    description: "{{ keycloak_role_description }}"
    composite: true
    composites: "{{ keycloak_role_composites }}"
    state: present
  register: result

- name: Assert realm role created with composites
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state.composites | length == 3

- name: Realm role with composites (idempotency)
  middleware_automation.keycloak.keycloak_role:
    name: composite-role
    realm: "{{ ephemeral_realm }}"
    description: "{{ keycloak_role_description }}"
    composite: true
    composites: "{{ keycloak_role_composites }}"
    state: present
  register: result

- name: Assert composites unchanged
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.end_state.composites | length == 3

- name: Realm composites with aliases (idempotency)
  middleware_automation.keycloak.keycloak_role:
    name: composite-role
    realm: "{{ ephemeral_realm }}"
    description: "{{ keycloak_role_description }}"
    composite: true
    composites: "{{ keycloak_role_composites_with_aliases }}"
    state: present
  register: result

- name: Assert composites unchanged with aliases
  ansible.builtin.assert:
    that:
      - result is not changed

- name: Remove one composite from realm role
  middleware_automation.keycloak.keycloak_role:
    name: composite-role
    realm: "{{ ephemeral_realm }}"
    description: "{{ keycloak_role_description }}"
    composite: true
    composites: "{{ keycloak_role_composites_with_absent }}"
    state: present
  register: result

- name: Assert composite removed
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state.composites | length == 2

- name: Delete composite realm role
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    name: composite-role
    state: absent
  register: result

- name: Assert composite role deleted
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state == {}

- name: Delete absent realm role with composites
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    name: composite-role
    state: absent
  register: result

- name: Assert not changed and realm role absent
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.end_state == {}

# --- Composite client roles ---

- name: Create client role with composites
  middleware_automation.keycloak.keycloak_role:
    name: composite-client-role
    client_id: myclient
    realm: "{{ ephemeral_realm }}"
    description: "{{ keycloak_role_description }}"
    composite: true
    composites: "{{ keycloak_role_composites }}"
    state: present
  register: result

- name: Assert client role created with composites
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state.composites | length == 3

- name: Client role with composites (idempotency)
  middleware_automation.keycloak.keycloak_role:
    name: composite-client-role
    client_id: myclient
    realm: "{{ ephemeral_realm }}"
    description: "{{ keycloak_role_description }}"
    composite: true
    composites: "{{ keycloak_role_composites }}"
    state: present
  register: result

- name: Assert client composites unchanged
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.end_state.composites | length == 3

- name: Remove one composite from client role
  middleware_automation.keycloak.keycloak_role:
    name: composite-client-role
    client_id: myclient
    realm: "{{ ephemeral_realm }}"
    description: "{{ keycloak_role_description }}"
    composite: true
    composites: "{{ keycloak_role_composites_with_absent }}"
    state: present
  register: result

- name: Assert composite removed from client role
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state.composites | length == 2

- name: Delete composite client role
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    name: composite-client-role
    client_id: myclient
    state: absent
  register: result

- name: Assert composite client role deleted
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state == {}

- name: Delete absent client role with composites
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ ephemeral_realm }}"
    name: composite-client-role
    client_id: myclient
    state: absent
  register: result

- name: Assert not changed and client role absent
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.end_state == {}
