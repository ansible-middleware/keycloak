---
# Ported from community.general tests/integration/targets/keycloak_client_rolescope
# Tests multi-role mapping, remap idempotency, partial removal, error handling,
# duplicate roles, realm role operations, full-scope client rejection, and check_mode.

# --- Fixtures ---

- name: Create realm roles for rolescope test
  middleware_automation.keycloak.keycloak_role:
    name: "{{ item }}"
    realm: "{{ ephemeral_realm }}"
    state: present
  loop:
    - realm-role-admin
    - realm-role-user

- name: Create private client (full_scope_allowed)
  middleware_automation.keycloak.keycloak_client:
    realm: "{{ ephemeral_realm }}"
    client_id: backend-client-private
    state: present
    redirect_uris:
      - "https://my-backend-api.c.org/"
    full_scope_allowed: true
    attributes: {"backchannel.logout.session.required": true, "backchannel.logout.revoke.offline.tokens": false, "client.secret.creation.time": 0}
    public_client: false

- name: Create client roles on private client
  middleware_automation.keycloak.keycloak_role:
    name: "{{ item }}"
    realm: "{{ ephemeral_realm }}"
    client_id: backend-client-private
    state: present
  loop:
    - client-role-admin
    - client-role-user

- name: Create public client (full_scope_allowed false)
  middleware_automation.keycloak.keycloak_client:
    realm: "{{ ephemeral_realm }}"
    client_id: frontend-client-public
    redirect_uris:
      - "https://my-onepage-app-frontend.c.org/"
    attributes: {"backchannel.logout.session.required": true, "backchannel.logout.revoke.offline.tokens": false, "client.secret.creation.time": 0}
    full_scope_allowed: false
    public_client: true

# --- Client role scope mapping ---

- name: Map two client roles to public client
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: frontend-client-public
    role_owner_client_id: backend-client-private
    role_names:
      - client-role-admin
      - client-role-user
  register: result

- name: Assert both client roles mapped
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state | length == 2

- name: Remap single role (additive idempotency)
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: frontend-client-public
    role_owner_client_id: backend-client-private
    role_names:
      - client-role-user
  register: result

- name: Assert no change - both still mapped
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.end_state | length == 2

- name: Remove admin role from public client scope
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: frontend-client-public
    role_owner_client_id: backend-client-private
    role_names:
      - client-role-admin
    state: absent
  register: result

- name: Assert admin removed, user remains
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state | length == 1
      - result.end_state[0].name == "client-role-user"

# --- Error: missing role ---

- name: Map non-existent client role (expect failure)
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: frontend-client-public
    role_owner_client_id: backend-client-private
    role_names:
      - client-role-admin
      - client-role-missing
  ignore_errors: true
  register: result

- name: Assert failure on missing client role
  ansible.builtin.assert:
    that:
      - result is failed

# --- Duplicate role names ---

- name: Map duplicate role names
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: frontend-client-public
    role_owner_client_id: backend-client-private
    role_names:
      - client-role-admin
      - client-role-admin
  register: result

- name: Assert duplicate handled - both roles mapped
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state | length == 2

# --- Error: full-scope client ---

- name: Map realm role to full-scope private client (expect failure)
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: backend-client-private
    role_names:
      - realm-role-admin
  ignore_errors: true
  register: result

- name: Assert failure on full-scope client
  ansible.builtin.assert:
    that:
      - result is failed

# --- Realm role scope mapping ---

- name: Map one realm role to public client
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: frontend-client-public
    role_names:
      - realm-role-admin
  register: result

- name: Assert realm role mapped
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state | length == 1

- name: Map two realm roles to public client
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: frontend-client-public
    role_names:
      - realm-role-admin
      - realm-role-user
  register: result

- name: Assert both realm roles mapped
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state | length == 2

- name: Unmap all realm roles from public client
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: frontend-client-public
    role_names:
      - realm-role-admin
      - realm-role-user
    state: absent
  register: result

- name: Assert all realm roles unmapped
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state | length == 0

# --- Error: missing realm role ---

- name: Map non-existent realm role (expect failure)
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: frontend-client-public
    role_names:
      - client-role-missing
  ignore_errors: true
  register: result

- name: Assert failure on missing realm role
  ansible.builtin.assert:
    that:
      - result is failed

# --- Check mode ---

- name: Check-mode map realm roles to public client
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: frontend-client-public
    role_names:
      - realm-role-admin
      - realm-role-user
  check_mode: true
  register: result

- name: Assert check-mode reports changed
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state | length == 2

- name: Verify check-mode did not actually apply changes
  middleware_automation.keycloak.keycloak_client_rolescope:
    realm: "{{ ephemeral_realm }}"
    target_client_id: frontend-client-public
    role_names: []
  register: result

- name: Assert no roles present after check-mode
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.end_state | length == 0
