---
- name: Verify
  hosts: all
  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Check if keycloak service started
      ansible.builtin.assert:
        that:
          - ansible_facts.services["keycloak.service"]["state"] == "running"
          - ansible_facts.services["keycloak.service"]["status"] == "enabled"

    - name: Verify we are running on requested JAVA_HOME # noqa blocked_modules command-instead-of-module
      ansible.builtin.shell: |
        set -o pipefail
        ps -ef | grep '/opt/openjdk' | grep -v grep
      args:
        executable: /bin/bash
      changed_when: False

    - name: Set internal envvar
      ansible.builtin.set_fact:
        hera_home: "{{ lookup('env', 'HERA_HOME') }}"

    - name: Verify openid config
      block:
        - name: Fetch openID config
          ansible.builtin.uri:
            url: http://localhost:8080/realms/master/.well-known/openid-configuration
          register: openid_config
        - name: Verify endpoint URLs
          ansible.builtin.assert:
            that:
              - openid_config.json["backchannel_authentication_endpoint"] == 'http://localhost:8080/realms/master/protocol/openid-connect/ext/ciba/auth'
              - openid_config.json['issuer'] == 'http://localhost:8080/realms/master'
              - openid_config.json['authorization_endpoint'] == 'http://localhost:8080/realms/master/protocol/openid-connect/auth'
              - openid_config.json['token_endpoint'] == 'http://localhost:8080/realms/master/protocol/openid-connect/token'
      when:
        - hera_home is defined
        - hera_home | length == 0
