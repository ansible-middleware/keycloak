---
up_attributes_default:
  - name: username
    displayName: "${username}"
    validations:
      length:
        min: 3
        max: 255
      usernameProhibitedCharacters: {}
      up_username_not_idn_homograph: {}
    annotations: {}
    permissions:
      view:
        - admin
        - user
      edit: []
    multivalued: false
  - name: email
    displayName: "${email}"
    validations:
      email: {}
      length:
        max: 255
    annotations: {}
    required:
      roles:
        - user
    permissions:
      view:
        - admin
        - user
      edit: []
    multivalued: false
  - name: firstName
    displayName: "${firstName}"
    validations:
      length:
        max: 255
      personNameProhibitedCharacters: {}
    annotations: {}
    required:
      roles:
        - user
    permissions:
      view:
        - admin
        - user
      edit: []
    multivalued: false
  - name: lastName
    displayName: "${lastName}"
    validations:
      length:
        max: 255
      person_name_prohibited_characters: {}
    annotations: {}
    required:
      roles:
        - user
    permissions:
      view:
        - admin
        - user
      edit: []
    multivalued: false

up_attributes_additional:
  - name: additionalAttribute
    displayName: additionalAttribute
    group: user-metadata
    required:
      roles:
        - user
    permissions:
      view:
        - admin
        - user
      edit: []
    multivalued: false

up_groups_default:
  - name: user-metadata
    displayHeader: User metadata
    displayDescription: Attributes, which refer to user metadata

up_config_default:
  kc_user_profile_config:
    - attributes: "{{ up_attributes_default }}"
      groups: "{{ up_groups_default }}"

up_config_updated:
  kc_user_profile_config:
    - attributes: "{{ up_attributes_default + up_attributes_additional }}"
      groups: "{{ up_groups_default }}"

up_config_unmanaged_enabled:
  kc_user_profile_config:
    - unmanagedAttributePolicy: ENABLED
      attributes: "{{ up_attributes_default }}"

up_config_unmanaged_admin_edit:
  kc_user_profile_config:
    - unmanagedAttributePolicy: ADMIN_EDIT
      attributes: "{{ up_attributes_default }}"

up_config_unmanaged_admin_view:
  kc_user_profile_config:
    - unmanagedAttributePolicy: ADMIN_VIEW
      attributes: "{{ up_attributes_default }}"
