---
# Ported from community.general tests/integration/targets/keycloak_realm_key
# Tests auto-generated key providers: HMAC, AES, ECDSA, RSA, RSA-ENC, ECDH, EdDSA.
# Skips RSA with private key (needs external key material) and Java Keystore (needs keystore file).

# --- HMAC generated key ---

- name: Create HMAC key (check mode)
  middleware_automation.keycloak.keycloak_realm_key:
    name: molecule-rk-hmac
    state: present
    parent_id: "{{ ephemeral_realm }}"
    provider_id: hmac-generated
    config:
      enabled: true
      active: true
      priority: 100
      algorithm: HS256
      secret_size: 64
  check_mode: true
  register: result

- name: Assert HMAC key would be created
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state != {}
      - result.end_state.name == "molecule-rk-hmac"
      - result.end_state.providerId == "hmac-generated"
      - result.end_state.config.algorithm == ["HS256"]
      - result.end_state.config.secretSize == ["64"]
      - result.msg == "Realm key molecule-rk-hmac would be created"

- name: Create HMAC key
  middleware_automation.keycloak.keycloak_realm_key:
    name: molecule-rk-hmac
    state: present
    parent_id: "{{ ephemeral_realm }}"
    provider_id: hmac-generated
    config:
      enabled: true
      active: true
      priority: 100
      algorithm: HS256
      secret_size: 64
  register: result

- name: Assert HMAC key was created
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state != {}
      - result.end_state.name == "molecule-rk-hmac"
      - result.end_state.providerId == "hmac-generated"
      - result.end_state.providerType == "org.keycloak.keys.KeyProvider"
      - result.end_state.config.algorithm == ["HS256"]
      - result.end_state.config.secretSize == ["64"]
      - result.msg == "Realm key molecule-rk-hmac created"

- name: Create HMAC key (idempotency)
  middleware_automation.keycloak.keycloak_realm_key:
    name: molecule-rk-hmac
    state: present
    parent_id: "{{ ephemeral_realm }}"
    provider_id: hmac-generated
    config:
      enabled: true
      active: true
      priority: 100
      algorithm: HS256
      secret_size: 64
  register: result

- name: Assert HMAC key is in sync
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.msg == "Realm key molecule-rk-hmac was in sync"

- name: Update HMAC key priority
  middleware_automation.keycloak.keycloak_realm_key:
    name: molecule-rk-hmac
    state: present
    parent_id: "{{ ephemeral_realm }}"
    provider_id: hmac-generated
    config:
      enabled: true
      active: true
      priority: 110
      algorithm: HS256
      secret_size: 64
  register: result

- name: Assert HMAC key was updated
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state.config.priority == ["110"]
      - "'config.priority' in result.msg"

- name: Remove HMAC key
  middleware_automation.keycloak.keycloak_realm_key:
    name: molecule-rk-hmac
    state: absent
    parent_id: "{{ ephemeral_realm }}"
    provider_id: hmac-generated
    config:
      priority: 110
  register: result

- name: Assert HMAC key was deleted
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state == {}
      - result.msg == "Realm key molecule-rk-hmac deleted"

