---
- name: Verify
  hosts: all
  vars:
    keycloak_quarkus_bootstrap_admin_password: "remembertochangeme"
    keycloak_quarkus_bootstrap_admin_user: "remembertochangeme"
    keycloak_uri: "http://localhost:8080/auth"
  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:
    - name: Check if keycloak service started
      ansible.builtin.assert:
        that:
          - ansible_facts.services["keycloak.service"]["state"] == "running"
          - ansible_facts.services["keycloak.service"]["status"] == "enabled"
    - name: Verify openid endpoint with relative path
      ansible.builtin.uri:
        url: "{{ keycloak_uri }}/realms/master/.well-known/openid-configuration"
        method: GET
        validate_certs: no
      register: keycloak_openid_response
      until: keycloak_openid_response.status == 200
      retries: 5
      delay: 5
