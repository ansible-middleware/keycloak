- name: Create realm
  middleware_automation.keycloak.keycloak_realm:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    id: "{{ realm }}"
    realm: "{{ realm }}"
    state: present

- name: Create client
  middleware_automation.keycloak.keycloak_client:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    realm: "{{ realm }}"
    client_id: "{{ client_id }}"
    service_accounts_enabled: true
    state: present
  register: client

- name: Create new realm role
  middleware_automation.keycloak.keycloak_role:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    realm: "{{ realm }}"
    name: "{{ role }}"
    description: "{{ description_1 }}"
    state: present

- name: Map a realm role to client service account
  vars:
    keycloak_roles:
      - name: '{{ role }}'
  middleware_automation.keycloak.keycloak_user_rolemapping:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    realm: "{{ realm }}"
    service_account_user_client_id: "{{ client_id }}"
    roles: "{{ keycloak_roles }}"
    state: present
  register: result

- name: Assert realm role is assigned
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state | selectattr("clientRole", "eq", false) | selectattr("name", "eq", role) | list | count > 0

- name: Unmap a realm role from client service account
  vars:
    keycloak_roles:
      - name: '{{ role }}'
  middleware_automation.keycloak.keycloak_user_rolemapping:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    realm: "{{ realm }}"
    service_account_user_client_id: "{{ client_id }}"
    roles: "{{ keycloak_roles }}"
    state: absent
  register: result

- name: Assert realm role is unassigned
  ansible.builtin.assert:
    that:
      - result is changed
      - (result.end_state | length) == (result.existing | length) - 1
      - result.existing | selectattr("clientRole", "eq", false) | selectattr("name", "eq", role) | list | count > 0
      - result.end_state | selectattr("clientRole", "eq", false) | selectattr("name", "eq", role) | list | count == 0

- name: Delete existing realm role
  middleware_automation.keycloak.keycloak_role:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    realm: "{{ realm }}"
    name: "{{ role }}"
    state: absent

- name: Create second client (for cross-client role mapping test)
  middleware_automation.keycloak.keycloak_client:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    realm: "{{ realm }}"
    client_id: "{{ client_id_2 }}"
    service_accounts_enabled: true
    state: present
  register: client_2

- name: Create new client role
  middleware_automation.keycloak.keycloak_role:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    realm: "{{ realm }}"
    client_id: "{{ client_id }}"
    name: "{{ role }}"
    description: "{{ description_1 }}"
    state: present

- name: Map a client role to a user with no existing roles for that client
  vars:
    keycloak_roles:
      - name: '{{ role }}'
  middleware_automation.keycloak.keycloak_user_rolemapping:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    realm: "{{ realm }}"
    client_id: "{{ client_id }}"
    service_account_user_client_id: "{{ client_id_2 }}"
    roles: "{{ keycloak_roles }}"
    state: present
  register: result

- name: Assert client role is assigned to user with no prior roles
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state | selectattr("clientRole", "eq", true) | selectattr("name", "eq", role) | list | count > 0

- name: Unmap the cross-client role mapping
  vars:
    keycloak_roles:
      - name: '{{ role }}'
  middleware_automation.keycloak.keycloak_user_rolemapping:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    realm: "{{ realm }}"
    client_id: "{{ client_id }}"
    service_account_user_client_id: "{{ client_id_2 }}"
    roles: "{{ keycloak_roles }}"
    state: absent
  register: result

- name: Assert cross-client role mapping is removed
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state == []

- name: Map a client role to client service account
  vars:
    keycloak_roles:
      - name: '{{ role }}'
  middleware_automation.keycloak.keycloak_user_rolemapping:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    realm: "{{ realm }}"
    client_id: "{{ client_id }}"
    service_account_user_client_id: "{{ client_id }}"
    roles: "{{ keycloak_roles }}"
    state: present
  register: result

- name: Assert client role is assigned
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state | selectattr("clientRole", "eq", true) | selectattr("name", "eq", role) | list | count > 0

- name: Unmap a client role from client service account
  vars:
    keycloak_roles:
      - name: '{{ role }}'
  middleware_automation.keycloak.keycloak_user_rolemapping:
    auth_keycloak_url: "{{ url }}"
    auth_realm: "{{ admin_realm }}"
    auth_username: "{{ admin_user }}"
    auth_password: "{{ admin_password }}"
    realm: "{{ realm }}"
    client_id: "{{ client_id }}"
    service_account_user_client_id: "{{ client_id }}"
    roles: "{{ keycloak_roles }}"
    state: absent
  register: result

- name: Assert client role is unassigned
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state == []
      - result.existing | selectattr("clientRole", "eq", true) | selectattr("name", "eq", role) | list | count > 0
