---
# Ported from community.general tests/integration/targets/keycloak_identity_provider
# Tests create with mappers, mapper CRUD, update, clientSecret masking, delete idempotency, fromUrl discovery.

- name: Create new identity provider
  middleware_automation.keycloak.keycloak_identity_provider:
    realm: "{{ ephemeral_realm }}"
    alias: myidp
    display_name: OpenID Connect IdP
    enabled: true
    provider_id: oidc
    config:
      issuer: https://idp.example.com
      authorizationUrl: https://idp.example.com/auth
      tokenUrl: https://idp.example.com/token
      userInfoUrl: https://idp.example.com/userinfo
      clientAuthMethod: client_secret_post
      clientId: clientid
      clientSecret: clientsecret
      syncMode: FORCE
    mappers:
      - name: "first_name"
        identityProviderAlias: myidp
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          claim: "first_name"
          user.attribute: "first_name"
          syncMode: "INHERIT"
      - name: "last_name"
        identityProviderAlias: myidp
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          claim: "last_name"
          user.attribute: "last_name"
          syncMode: "INHERIT"
    state: present
  register: result

- name: Assert identity provider created
  ansible.builtin.assert:
    that:
      - result is changed
      - result.existing == {}
      - result.end_state.alias == "myidp"
      - result.end_state.mappers != []
      - result.end_state.config.clientSecret == "**********"

- name: Update existing identity provider (no change)
  middleware_automation.keycloak.keycloak_identity_provider:
    realm: "{{ ephemeral_realm }}"
    alias: myidp
    enabled: true
    provider_id: oidc
    config:
      issuer: https://idp.example.com
      authorizationUrl: https://idp.example.com/auth
      tokenUrl: https://idp.example.com/token
      userInfoUrl: https://idp.example.com/userinfo
      clientAuthMethod: client_secret_post
      clientId: clientid
      clientSecret: "**********"
      syncMode: FORCE
    mappers:
      - name: "first_name"
        identityProviderAlias: myidp
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          claim: "first_name"
          user.attribute: "first_name"
          syncMode: "INHERIT"
      - name: "last_name"
        identityProviderAlias: myidp
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          claim: "last_name"
          user.attribute: "last_name"
          syncMode: "INHERIT"
    state: present
  register: result

- name: Assert identity provider unchanged
  ansible.builtin.assert:
    that:
      - result is not changed

- name: Update existing identity provider (with change, no mapper change)
  middleware_automation.keycloak.keycloak_identity_provider:
    realm: "{{ ephemeral_realm }}"
    alias: myidp
    enabled: false
    state: present
  register: result

- name: Assert identity provider updated
  ansible.builtin.assert:
    that:
      - result is changed
      - result.existing.enabled == true
      - result.end_state.enabled == false

- name: Update existing identity provider (delete mapper)
  middleware_automation.keycloak.keycloak_identity_provider:
    realm: "{{ ephemeral_realm }}"
    alias: myidp
    state: present
    mappers:
      - name: "first_name"
        identityProviderAlias: myidp
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          claim: "first_name"
          user.attribute: "first_name"
          syncMode: "INHERIT"
  register: result

- name: Assert identity provider updated
  ansible.builtin.assert:
    that:
      - result is changed
      - result.existing.mappers | length == 2
      - result.end_state.mappers | length == 1
      - result.end_state.mappers[0].name == "first_name"

- name: Update existing identity provider (add mapper)
  middleware_automation.keycloak.keycloak_identity_provider:
    realm: "{{ ephemeral_realm }}"
    alias: myidp
    state: present
    mappers:
      - name: "last_name"
        identityProviderAlias: myidp
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          claim: "last_name"
          user.attribute: "last_name"
          syncMode: "INHERIT"
      - name: "first_name"
        identityProviderAlias: myidp
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          claim: "first_name"
          user.attribute: "first_name"
          syncMode: "INHERIT"
  register: result

- name: Assert identity provider updated
  ansible.builtin.assert:
    that:
      - result is changed
      - result.existing.mappers | length == 1
      - result.end_state.mappers | length == 2

- name: Update existing identity provider (no change, test mapper idempotency)
  middleware_automation.keycloak.keycloak_identity_provider:
    realm: "{{ ephemeral_realm }}"
    alias: myidp
    state: present
    mappers:
      - name: "last_name"
        identityProviderAlias: myidp
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          claim: "last_name"
          user.attribute: "last_name"
          syncMode: "INHERIT"
      - name: "first_name"
        identityProviderAlias: myidp
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          claim: "first_name"
          user.attribute: "first_name"
          syncMode: "INHERIT"
  register: result

- name: Assert identity provider updated
  ansible.builtin.assert:
    that:
      - result is not changed

- name: Delete existing identity provider
  middleware_automation.keycloak.keycloak_identity_provider:
    realm: "{{ ephemeral_realm }}"
    alias: myidp
    state: absent
  register: result

- name: Assert identity provider deleted
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state == {}

- name: Delete absent identity provider
  middleware_automation.keycloak.keycloak_identity_provider:
    realm: "{{ ephemeral_realm }}"
    alias: myidp
    state: absent
  register: result

- name: Assert identity provider unchanged
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.end_state == {}

- name: Create IDP realm
  middleware_automation.keycloak.keycloak_realm:
    id: myidprealm
    realm: myidprealm
    state: present

- name: Create new identity provider with fromUrl
  middleware_automation.keycloak.keycloak_identity_provider:
    realm: "{{ ephemeral_realm }}"
    alias: myidpfromurl
    display_name: OpenID Connect IdP from url
    enabled: true
    provider_id: oidc
    config:
      fromUrl: "{{ auth_keycloak_url }}/realms/myidprealm/.well-known/openid-configuration"
      clientAuthMethod: client_secret_post
      clientId: clientid
      clientSecret: clientsecret
      syncMode: FORCE
    state: present
  register: result

- name: Assert identity provider created with IDP endpoints
  ansible.builtin.assert:
    that:
      - result is changed
      - result.end_state.config.authorizationUrl == auth_keycloak_url ~ "/realms/myidprealm/protocol/openid-connect/auth"
      - result.end_state.config.issuer == auth_keycloak_url ~ "/realms/myidprealm"
      - result.end_state.config.jwksUrl == auth_keycloak_url ~ "/realms/myidprealm/protocol/openid-connect/certs"
      - result.end_state.config.logoutUrl == auth_keycloak_url ~ "/realms/myidprealm/protocol/openid-connect/logout"
      - result.end_state.config.tokenUrl == auth_keycloak_url ~ "/realms/myidprealm/protocol/openid-connect/token"
      - result.end_state.config.userInfoUrl == auth_keycloak_url ~ "/realms/myidprealm/protocol/openid-connect/userinfo"

- name: Create new identity provider with fromUrl and exclusion should fail
  middleware_automation.keycloak.keycloak_identity_provider:
    realm: "{{ ephemeral_realm }}"
    alias: "mustfail"
    display_name: Failed OpenID Connect IdP from url
    enabled: true
    provider_id: oidc
    config: "{{ config | combine(endpoint) }}"
    state: present
  vars:
    config:
      fromUrl: "{{ auth_keycloak_url }}/realms/myidprealm/.well-known/openid-configuration"
      clientAuthMethod: client_secret_post
      clientId: clientid
      clientSecret: clientsecret
    endpoint: "{{ { item: auth_keycloak_url ~ '/realms/myidprealm/protocol/openid-connect/' ~ item } }}"
  with_items: ['userInfoUrl', 'authorizationUrl', 'tokenUrl', 'logoutUrl', 'issuer', 'jwksUrl']
  register: result
  ignore_errors: true

- name: Check failure of identity provider creation with fromUrl and userInfoUrl
  ansible.builtin.assert:
    that:
      - result is not changed
      - result is failed
      - result.results | selectattr('failed', 'equalto', false) | list | length == 0
